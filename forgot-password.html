<!DOCTYPE html>
<html lang="en">
<head>
    
    <!-- API Configuration - MUST be loaded first -->
    <script src="js/config.js"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · DRMS‑QA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/landing.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6">

    <div class="max-w-md w-full">
        <!-- Back to login link -->
        <a href="landing.html" class="inline-flex items-center text-teal-700 hover:text-teal-800 mb-6 text-sm font-medium">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to login
        </a>

        <!-- Main card -->
        <div class="bg-white rounded-2xl minimal-card p-8">
            <!-- Icon and heading -->
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl">🔑</span>
                </div>
                <h2 class="text-2xl font-semibold text-gray-800">Forgot Password?</h2>
                <p class="text-gray-500 text-sm mt-2">Enter your email to receive a verification code</p>
            </div>

            <!-- Email form (shown initially) -->
            <form id="emailForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Email Address</label>
                    <input type="email" id="emailInput" placeholder="you@college.edu" required
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-gray-800 bg-gray-50/50 focus:bg-white transition-colors">
                </div>
                
                <button type="submit" 
                        class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-lg transition-colors">
                    Send Verification Code
                </button>
            </form>

            <!-- OTP form (hidden initially) -->
            <div id="otpSection" class="hidden space-y-5">
                <div class="text-center mb-4">
                    <p class="text-sm text-gray-600">Enter the 6-digit code sent to</p>
                    <p class="text-sm font-semibold text-gray-800" id="displayEmail"></p>
                </div>

                <form id="otpForm" class="space-y-5">
                    <div>
                        <input type="text" id="otpInput" maxlength="6" 
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-center text-2xl tracking-widest focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
                               placeholder="000000" required>
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-lg transition-colors">
                        Verify Code
                    </button>
                    
                    <button type="button" id="changeEmailBtn"
                            class="w-full border-2 border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-3 rounded-lg transition-colors">
                        Change Email
                    </button>
                </form>
            </div>

            <!-- New password form (hidden initially) -->
            <div id="passwordSection" class="hidden space-y-5">
                <div class="text-center mb-4">
                    <p class="text-sm text-green-600 font-medium">✓ Code verified successfully</p>
                    <p class="text-sm text-gray-600 mt-1">Enter your new password</p>
                </div>

                <form id="passwordForm" class="space-y-5">
                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-600 mb-1">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg text-gray-800 bg-gray-50/50 focus:bg-white transition-colors pr-10">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer pt-7" id="toggleNewPassword">
                            <svg class="eye-icon h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            <svg class="eye-off-icon h-5 w-5 text-gray-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 .95-3.112 3.544-5.47 6.69-6.336M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6M3 3l6 6"/></svg>
                        </span>
                    </div>
                    
                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-600 mb-1">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg text-gray-800 bg-gray-50/50 focus:bg-white transition-colors pr-10">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer pt-7" id="toggleConfirmPassword">
                            <svg class="eye-icon h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            <svg class="eye-off-icon h-5 w-5 text-gray-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 .95-3.112 3.544-5.47 6.69-6.336M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6M3 3l6 6"/></svg>
                        </span>
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-lg transition-colors">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>

        <p class="text-xs text-gray-400 text-center mt-4">
            Didn't receive the code? Check your spam folder or contact support.
        </p>
    </div>

    <script src="js/forgot-password.js"></script>
</body>
</html>
