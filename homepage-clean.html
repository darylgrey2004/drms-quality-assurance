<!-- Document Preview Modal ONLY - Place this at the end of homepage.html before </body> -->

<!-- Document Preview Modal -->
<div id="docPreviewModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4" style="z-index: 10000;">
    <div class="bg-white rounded-xl w-full max-w-6xl h-[90vh] flex flex-col">
        <div class="flex items-center justify-between p-4 border-b">
            <h3 id="docPreviewTitle" class="text-lg font-semibold text-gray-800">Document Preview</h3>
            <button id="docPreviewCloseBtn" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div class="flex-1 overflow-hidden">
            <iframe id="docPreviewFrame" class="w-full h-full" frameborder="0"></iframe>
        </div>
    </div>
</div>
