<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRMS-QA · Register</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="css/registration.css">
</head>
<body class="min-h-screen bg-navy-deep flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <span class="text-2xl">📝</span>
            </div>
            <h2 class="text-2xl font-semibold text-gray-800">Create Account</h2>
            <p class="text-gray-500 text-sm mt-1">Register for DRMS-QA access</p>
        </div>

        <form id="registrationForm" class="space-y-5">
            <!-- Full Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
                <input type="text" id="fullName" 
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                       placeholder="e.g., Juan M. Dela Cruz" required>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address <span class="text-red-500">*</span></label>
                <input type="email" id="email" 
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                       placeholder="you@college.edu" required>
            </div>

            <!-- Role Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Role <span class="text-red-500">*</span></label>
                <select id="role" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition bg-white">
                    <option value="">Select your role</option>
                    <option value="faculty">Faculty Member</option>
                    <option value="area-chair">Area Chair / Program Head</option>
                    <option value="dean">Dean</option>
                    <option value="qa-coordinator">QA Coordinator</option>
                    <option value="evaluator">External Evaluator</option>
                </select>
            </div>

            <!-- Note about next steps -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-700 flex items-start gap-2">
                <span>ℹ️</span>
                <span>After registration, you'll complete a detailed faculty profile form. This information helps us maintain accurate QA records.</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-lg transition-all hover:shadow-md">
                Continue to Profile Setup →
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? 
            <a href="landing.html" class="text-teal-700 hover:text-teal-800 font-medium">Sign in</a>
        </p>
    </div>

    <script src="js/registration.js"></script>
</body>
</html>
