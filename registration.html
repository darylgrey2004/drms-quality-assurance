<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRMS-QA · Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/registration.css">
</head>
<body class="min-h-screen bg-navy-deep flex items-center justify-center p-4">
    
    <div class="max-w-md w-full bg-white rounded-2xl p-8">
        <h2 class="text-2xl font-semibold text-navy-900 mb-1">Create Account</h2>
        <p class="text-gray-500 text-sm mb-6">Register for DRMS-QA access</p>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
                <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
                <input type="email" class="w-full px-4 py-2 border border-gray-200 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Role</label>
                <select class="w-full px-4 py-2 border border-gray-200 rounded-lg">
                    <option>Faculty</option>
                    <option>Area Chair / Program Head</option>
                    <option>Dean</option>
                    <option>QA Coordinator</option>
                    <option>External Evaluator</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Department</label>
                <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
                <input type="password" class="w-full px-4 py-2 border border-gray-200 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Confirm Password</label>
                <input type="password" class="w-full px-4 py-2 border border-gray-200 rounded-lg">
            </div>

            <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-lg transition-colors mt-4">
                Submit Registration
            </button>
            
            <p class="text-xs text-gray-400 text-center mt-4">
                By registering, you agree to the Terms of Service and Privacy Policy.
                Your account will be activated upon administrator approval.
            </p>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? 
            <a href="landing.html" class="text-teal-700 hover:text-teal-800">Sign in</a>
        </p>
    </div>

    <script src="js/registration.js"></script>
</body>
</html>
