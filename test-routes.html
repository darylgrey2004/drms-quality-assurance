<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Routes</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-section h3 { margin-top: 0; color: #333; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; max-height: 400px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>API Routes Test Page</h1>
    <p>This page tests if the backend routes are working correctly.</p>

    <div class="test-section">
        <h3>1. Test Categories Route</h3>
        <button onclick="testCategories()">Test /api/documents/categories</button>
        <div id="categoriesResult"></div>
    </div>

    <div class="test-section">
        <h3>2. Test Departments Route</h3>
        <button onclick="testDepartments()">Test /api/documents/departments</button>
        <div id="departmentsResult"></div>
    </div>

    <div class="test-section">
        <h3>3. Test User Department Route</h3>
        <button onclick="testUserDepartment()">Test /api/documents/user/department</button>
        <div id="userDepartmentResult"></div>
    </div>

    <div class="test-section">
        <h3>4. Test Documents Route</h3>
        <button onclick="testDocuments()">Test /api/documents</button>
        <div id="documentsResult"></div>
    </div>

    <div class="test-section">
        <h3>5. Test Approvals Route</h3>
        <button onclick="testApprovals()">Test /api/approvals/pending</button>
        <div id="approvalsResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        let token = localStorage.getItem('token');

        if (!token) {
            document.body.innerHTML = '<h2 class="error">No token found! Please login first.</h2>';
        }

        async function testRoute(url, resultElementId) {
            const resultDiv = document.getElementById(resultElementId);
            resultDiv.innerHTML = '<p class="info">Testing...</p>';

            try {
                console.log('Testing:', url);
                const response = await fetch(url, {
                    headers: { 'x-auth-token': token }
                });

                console.log('Status:', response.status);
                const data = await response.json();
                console.log('Data:', data);

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <p class="success">✓ Success (${response.status})</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">✗ Failed (${response.status})</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <p class="error">✗ Error: ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }

        function testCategories() {
            testRoute(`${API_BASE}/api/documents/categories`, 'categoriesResult');
        }

        function testDepartments() {
            testRoute(`${API_BASE}/api/documents/departments`, 'departmentsResult');
        }

        function testUserDepartment() {
            testRoute(`${API_BASE}/api/documents/user/department`, 'userDepartmentResult');
        }

        function testDocuments() {
            testRoute(`${API_BASE}/api/documents`, 'documentsResult');
        }

        function testApprovals() {
            testRoute(`${API_BASE}/api/approvals/pending`, 'approvalsResult');
        }
    </script>
</body>
</html>
