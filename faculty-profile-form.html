<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRMS-QA · Complete Your Profile</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="css/faculty-profile-form.css">
</head>
<body class="min-h-screen bg-gray-100 py-8">

    <div class="max-w-5xl mx-auto px-4">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Employment Information</h1>
            <p class="text-gray-500 mt-2">Complete your employment details to continue</p>
        </div>

        <!-- Progress Steps - Simplified -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
            <div class="flex items-center justify-center gap-2">
                <span class="w-8 h-8 bg-teal-600 text-white rounded-full flex items-center justify-center text-sm font-bold">2</span>
                <span class="text-sm font-medium">Employment Information</span>
            </div>
        </div>

        <form id="facultyProfileForm" class="space-y-8">
            <!-- ========== EMPLOYMENT INFORMATION (ONLY) ========== -->
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center gap-3 mb-5 pb-3 border-b border-gray-100">
                    <span class="w-8 h-8 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center">📋</span>
                    <h2 class="text-lg font-semibold text-gray-800">Employment Information</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Employee / Faculty ID <span class="text-red-500">*</span></label>
                        <input type="text" id="employeeId" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500" placeholder="e.g., 123456" maxlength="6" pattern="\d{1,6}" title="Employee ID must be up to 6 digits" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Current Designation / Position <span class="text-red-500">*</span></label>
                        <select id="position" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500" required>
                            <option value="" disabled selected>Select Position</option>
                            <option>Instructor I</option>
                            <option>Instructor II</option>
                            <option>Instructor III</option>
                            <option>Assistant Professor I</option>
                            <option>Assistant Professor II</option>
                            <option>Assistant Professor III</option>
                            <option>Associate Professor I</option>
                            <option>Associate Professor II</option>
                            <option>Associate Professor III</option>
                            <option>Professor I</option>
                            <option>Professor II</option>
                            <option>Professor III</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Department / Program Assignment <span class="text-red-500">*</span></label>
                        <select id="department" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500" required>
                            <option value="" disabled selected>Select Department</option>
                            <option>Bachelor of Elementary Education (BEED)</option>
                            <option>Bachelor of Secondary Education (BSED)</option>
                            <option>Bachelor of Physical Education (BPED)</option>
                            <option>Bachelor of Special Needs Education (BSNED) (SPED)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status of Employment <span class="text-red-500">*</span></label>
                        <select id="employmentStatus" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500" required>
                            <option value="" disabled selected>Select Status</option>
                            <option>Regular / Permanent</option>
                            <option>Contractual</option>
                            <option>Part-time</option>
                            <option>Probationary</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Submit Section -->
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="text-sm text-gray-500">
                        <span class="text-red-500">*</span> All fields are required
                    </div>
                    <div class="flex gap-3">
                        <button type="submit" class="px-8 py-3 bg-teal-700 hover:bg-teal-800 text-white rounded-lg transition-colors flex items-center gap-2 font-medium">
                            <span>✓</span> Complete Registration
                        </button>
                    </div>
                </div>
                <p class="text-xs text-gray-400 text-center mt-4">
                    After submitting, log in to verify your WMSU email via OTP to activate your account.
                </p>
            </div>
        </form>
    </div>

    <script src="js/faculty-profile-form.js"></script>
</body>
</html>
